# Phase 2 (e-commerce mockup). Ports/names differ from Phase 1 (3000/3001) so both can run side by side.
name: hana-care-phase2

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://phatracare.phatra-leasing.com}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_LINE_URL: ${NEXT_PUBLIC_LINE_URL:-https://line.me}
        NEXT_PUBLIC_GA4_DEBUG: ${NEXT_PUBLIC_GA4_DEBUG:-false}
    image: hana-care-phase2-web:latest
    container_name: hana-care-phase2-web
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3000"
    environment:
      NODE_ENV: production
    volumes:
      - next-image-cache:/app/.next/cache

  # Dev mode: hot reload, no rebuild.
  #   docker compose --profile dev up -d dev     # http://localhost:3101
  dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: hana-care-phase2-dev
    working_dir: /app
    command: sh -c "npm ci && npx next dev -H 0.0.0.0 -p 3000"
    ports:
      - "${DEV_PORT:-3101}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_LINE_URL: ${NEXT_PUBLIC_LINE_URL:-https://line.me}
      NEXT_PUBLIC_GA4_DEBUG: ${NEXT_PUBLIC_GA4_DEBUG:-false}
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-next:/app/.next

volumes:
  next-image-cache:
  dev-node-modules:
  dev-next:
